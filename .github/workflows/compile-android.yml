name: Compile Android APK

on:
  push:
    branches: [ master, NET10, claude/build-galaxybuds-apk-3lENN ]
  pull_request:
    branches: [ master ]
  release:
     types:
       - published
       - prereleased
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Install Android workload
      run: dotnet workload install android --skip-manifest-update

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install Android SDK Platform
      run: sdkmanager "platforms;android-36" "build-tools;36.0.1"

    - name: Restore dependencies
      run: dotnet restore --configfile GalaxyBudsClient/nuget.config GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj

    - name: Build Android APK
      run: |
        dotnet publish -f net10.0-android36.1 -c Release \
          -p:AndroidPackageFormats=apk \
          -p:IsAndroid=true \
          -p:EmbedAssembliesIntoApk=true \
          -p:AndroidSdkDirectory=$ANDROID_HOME \
          GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj

    - name: Find APK
      id: find-apk
      run: |
        APK_PATH=$(find . -name "*.apk" -path "*/publish/*" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK at: $APK_PATH"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v6
      with:
        name: GalaxyBudsClient_Android_APK
        path: ${{ steps.find-apk.outputs.apk_path }}

  attach-to-release:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'release'

    steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v7
      with:
        name: GalaxyBudsClient_Android_APK

    - name: Rename APK
      run: |
        APK=$(find . -name "*.apk" | head -1)
        mv "$APK" GalaxyBudsClient_Android.apk

    - uses: AButler/upload-release-assets@v3.0.1
      with:
        files: 'GalaxyBudsClient_Android.apk'
        repo-token: ${{ secrets.GH_TOKEN }}
